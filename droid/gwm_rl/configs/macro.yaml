# FlashSAC, one absolute target pose per 44-tick macro-step.
# replay_ratio 352 = 8 updates/tick x 44 ticks per transition;
# warmup 8192 transitions = 8 macro-steps per env of uniform random targets.
# "env steps" are control ticks summed over all envs.

experiment_name: pickbowl
seed: 42
executor:
  n_move: 30              # ticks of straight-line motion to the target
  n_hold: 14              # ticks holding the target while the gripper switches
  reward_phase: hold      # the step's reward is the mean over the hold ticks (the reached state)

obs_groups:
  policy: [ "policy" ]
  critic: [ "policy" ]

num_envs: 2048
wall_budget_s: 700.0
lr_horizon_env_steps: 21000000
eval_interval_s: 60.0
stop_at_success: 1.01
stop_metric: success_at_end
stop_patience: 1
min_explore_success: 0.02          # of sweep_gate_metric in the exploring rollout
sweep_gate_metric: grasped_once
collect_during_eval: true

agent:
  replay_ratio: 352
  sample_batch_size: 2048
  n_step: 2
  gamma: 0.98
  temp_target_sigma: 0.15        # ~4 cm / 13 deg of target noise per decision
  learning_rate: 0.0003
  learning_rate_end: 0.00015
  buffer_capacity: 2097152
  warmup_transitions: 8192
  critic_hidden_dim: 256
  actor_hidden_dim: 128
  num_blocks: 2
  actor_update_period: 2
  critic_target_update_tau: 0.01
  normalized_G_max: 5.0
  critic_num_bins: 101
  actor_noise_zeta_mu: 2.0
  actor_noise_zeta_max: 1
  use_amp: true
  use_compile: true
