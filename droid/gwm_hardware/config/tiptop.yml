# TiPToP configuration for the `zhiwei` hardware rig.
#
# This is the AUTHORITATIVE copy. `tiptop/config/tiptop.yml` is a symlink to
# this file, installed by `gwm_hardware/common/install_rig_config.py`, so the rig
# config is versioned here instead of dirtying the pristine tiptop tree
# (G-18). `tiptop-config` writes through the symlink, so running it edits this
# file -- review the diff afterwards rather than letting it drift.

# == Robot connection and control ==
robot:
  # `panda_robotiq` is redirected to our 2F-140 model by
  # gwm_hardware/common/install_2f140_cutamp.py -- the rig carries a 2F-140, whose TCP
  # sits 62 mm further out than the stock 2F-85 cuTAMP would otherwise load.
  # Set GWM_TIPTOP_GRIPPER=2f85 to get the stock model back (droid-sim).
  type: panda_robotiq
  dof: 7

  # Bamboo control node: the RT machine, reached over the shared 192.168.68.x
  # WiFi. Measured 2.7 ms RTT / 0.245 ms jitter, vs 29 ms / 37 ms over the
  # Tailscale path, so this address rather than 100.80.197.100.
  host: "192.168.68.132"

  port: 5555
  gripper_port: 5559

  # Raised 0.2 -> 0.6 on 2026-08-18 after pick and place both ran clean at 0.2.
  # 0.6 is upstream's value at MIT. cuRobo post-process retiming, so it stretches
  # the finished trajectory and leaves the optimizer and cost terms alone.
  #
  # Worth knowing at speed: execution is open-loop -- the whole trajectory goes
  # up in one shot and execute_plan.py only checks that the controller accepted
  # it, never that anything was grasped. Nothing notices an object knocked over
  # on a fast approach.
  time_dilation_factor: 0.6

  # Robot configurations
  q_home: [0.0, -0.628, 0.0, -2.513, 0.0, 1.885, 0.0]
  # Chosen empirically 2026-08-18 by `gwm_hardware.common.find_capture_pose`: TiPToP
  # plans an entire episode from ONE wrist frame taken here, so this pose sets
  # what the system can see at all.
  #
  # TCP [0.45, 0.00, 0.55] straight down, yaw -90. Measured at the pose:
  # camera 633 mm above the table, tilt 3.3 deg, footprint 0.87 x 0.50 m, and
  # the table fills 87.8 % of the frame.
  #
  # yaw is the redundant DOF for a straight-down TCP and it is NOT free here --
  # the wrist camera is offset from the TCP axis, so yaw swings where the
  # footprint lands. Measured at TCP [0.50,-0.15,0.55]: yaw 0 put the robot's
  # own base across the frame's left third, +180 gave 61.7 % table, +90 gave
  # 70.2 %, -90 gave 85.8 % with the base out of frame entirely.
  #
  # Centred on y = 0, which is both the middle of the (now 1 m, centred) table
  # and the middle of M2T2's own y in [-0.30, +0.30] input crop.
  q_capture: [-0.2099, -0.1645, 0.1760, -1.3773, 0.0306, 1.2154, -0.0256]

# == Camera configurations ==
# Both are RealSense D400s; tiptop feeds their IR stereo pair to
# FoundationStereo rather than using the ASIC depth. Run
# `python -m gwm_hardware.common.rs_preflight` before every session -- the rig comes
# up with IR auto-exposure off, which saturates the pair and guts the depth.
cameras:
  # Wrist camera: TiPToP's only perception viewpoint.
  hand:
    serial: "035422072950"      # D435i
    type: realsense

  # Third-person camera: recording, viz-scene, and the GWM scorer's viewpoint.
  # tiptop itself reads only `hand` and `external`.
  external:
    serial: "348522073586"      # D435
    type: realsense

  # SECOND third-person camera, read only by gwm_hardware.gwm_arm (tiptop never
  # looks at this key). It exists because the sim's best-measured configuration
  # was two-camera score fusion: the two views' per-object score deviations
  # correlate only r=+0.58, and the between-view spread is as large as the
  # semantic signal itself, so averaging them beat every single view and every
  # other fusion rule under score noise (G-30).
  #
  # NOTE this camera produces NO depth for the pipeline -- it is an RGB scoring
  # viewpoint only. `rs_preflight` fails it on IR saturation, and that verdict
  # is about FoundationStereo's stereo pair, which nothing asks this camera for.
  # Wrist depth is the only depth the planner uses.
  # UNPLUGGED as of 2026-08-19: it faced a window, and RGB is the only thing the
  # scorer gets. Left declared so the intent is recorded; gwm_arm skips any
  # declared camera that is not connected rather than failing.
  external_2:
    serial: "134322070906"      # D435i, faces the robot from the opposite side
    type: realsense

# == Perception services ==
perception:
  foundation_stereo:
    url: "http://localhost:1234"

  m2t2:
    url: "http://localhost:8123"
    apply_bounds: true

  sam:
    mode: "local"

  recgen:
    url: "http://<endpoint>:18324"
    enabled: false
    target_faces: 10000
    concurrency: 6

  depth_trunc_m: 5.0
  voxel_downsample_size: 0.0075
  contact_threshold_m: 0.01
  mask_erosion_pixels: 3

# == Experimental features ==
experimental:
  pick_place_next_to: false
